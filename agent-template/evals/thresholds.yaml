# Thresholds are set by the business owner (__OWNER__), not by the harness or the build team.
# The current agreed minimum is 80%; agent-specific changes require owner approval.
tool_call_accuracy: 0.8       # share of cases calling the expected tools
outcome_quality: 0.8          # judge or reviewer score against expected_outcome
coverage: 80                 # minimum percentage of agent code covered by tests
max_regression: 0.0          # allowed drop versus evals/baseline/results.json
