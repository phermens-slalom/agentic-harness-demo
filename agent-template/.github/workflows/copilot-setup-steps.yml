# Prepares the environment the Copilot coding agent works in. GitHub only reads the job named
# `copilot-setup-steps`, and only its steps, permissions, runs-on, services, snapshot and
# timeout-minutes. It must be on the default branch to take effect.
# Network egress is NOT set here: see docs/copilot-agent-environment.md.
name: copilot-setup-steps
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]
permissions: {}
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.13"}
      # TODO(Security): install from the internal package mirror, and pin google-agents-cli.
      - run: uv tool install google-agents-cli
      - run: agents-cli install
