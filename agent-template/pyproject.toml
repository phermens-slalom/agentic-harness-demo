[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "__AGENT_NAME__"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["google-adk"]   # TODO: pin exact version

[project.scripts]
agentic-bootstrap = "agent.harness_bootstrap:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["skills/garage-summary/SKILL.md"]

[project.optional-dependencies]
lint = ["ruff>=0.6", "codespell>=2.3", "ty>=0.0.1"]   # `agents-cli lint` syncs this extra
dev = ["pytest>=8", "ruff>=0.6", "codespell>=2.3", "ty>=0.0.1"]

# `agents-cli install` runs a plain `uv sync`, which installs dependency groups (the `dev` group
# is on by default) but NOT optional extras, so pytest must live here for `uv run pytest`.
# The `dev` extra above is kept for CI's `pip install -e ".[dev]"`.
[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # the agent/ package is not installed; make it importable from the repo root
