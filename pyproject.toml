[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-harness-demo"
version = "0.2.0"
description = "Organisation-neutral agentic SDLC harness: policy, merge gate, bootstrap CLI, evals"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
# Real model/ADK adapters. Pin exact versions once verified (ADK moves fast).
adk = ["google-adk>=2.12,<3"]
# Input guard scanner (MIT, local, zero deps). Exact pin: a pattern-set change is a policy change.
guard = ["sunglasses==0.6.20"]
lint = ["ruff>=0.6", "codespell>=2.3", "ty>=0.0.1"]          # `agents-cli lint` syncs this extra
dev = ["sunglasses==0.6.20", "pytest>=8", "hypothesis>=6.120", "ruff>=0.6", "codespell>=2.3", "ty>=0.0.1"]

[project.scripts]
agentic-bootstrap = "harness.bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
harness = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 110

[tool.ty.src]
# agent-template is a separate project rendered for new agent repos; it has its own deps/pyproject.
exclude = ["agent-template"]

[tool.ty.analysis]
# google-adk is an optional extra (`pip install -e ".[adk]"`), not installed in the dev env.
allowed-unresolved-imports = ["google.adk.**", "google.genai.**"]
