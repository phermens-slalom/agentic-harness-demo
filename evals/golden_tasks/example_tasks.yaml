# Golden tasks. Replace these with real closed issues + the PRs humans merged
# for them (aim for 30-50 across 2-3 pilot repos, mixed tiers and difficulty).
#
# Each task has two halves:
#   expected: what a correct harness run should produce (from the human PR)
#   scenario: scripted builder/reviewer behaviour, used ONLY in --mode dry-run to
#             regression-test orchestration + policy without spending tokens.
# Optional `phase:` evaluates the policy at that agent platform phase (Phase 1 never auto-merges).
- id: quotes-142-rounding
  issue: {repo: example-org/quotes, number: 142, title: "Premium rounding off by 1c", labels: [agent:bugfix],
          body: "Quotes for NSW show 1c difference vs pricing engine."}
  expected: {decision: human_approval, tier: 2, approvers: [app_team, ai_governance]}
  scenario:
    builds:
      - {ci_green: false, files: [pricing/round.py], lines: 12, ci_summary: "test_nsw failed"}
      - {ci_green: true, checks: {lint: true, tests: true, evals_no_regression: true, secret_scan: true}, files: [pricing/round.py, tests/test_round.py], lines: 34}

- id: quotes-150-add-tests-phase1
  issue: {repo: example-org/quotes, number: 150, title: "Add tests for excess calc", labels: [agent:tests], body: "..."}
  expected: {decision: human_approval, tier: 1, approvers: [app_team, ai_governance]}
  scenario:
    builds: [{ci_green: true, checks: {lint: true, tests: true, evals_no_regression: true, secret_scan: true}, files: [tests/test_excess.py], lines: 80}]

- id: quotes-150-add-tests-phase3
  phase: 3
  issue: {repo: example-org/quotes, number: 150, title: "Add tests for excess calc", labels: [agent:tests], body: "..."}
  expected: {decision: auto_merge, tier: 1}
  scenario:
    builds: [{ci_green: true, checks: {lint: true, tests: true, evals_no_regression: true, secret_scan: true}, files: [tests/test_excess.py], lines: 80}]

